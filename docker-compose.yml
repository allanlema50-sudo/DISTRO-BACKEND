services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distro_backend}
      POSTGRES_USER: ${POSTGRES_USER:-distro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-distro_backend}
      DATABASE_USERNAME: ${POSTGRES_USER:-distro}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-logiflow}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@logiflow.local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_CONNECTION_TIMEOUT_MS: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_SMTP_TIMEOUT_MS: ${MAIL_SMTP_TIMEOUT_MS:-5000}
      MAIL_SMTP_WRITE_TIMEOUT_MS: ${MAIL_SMTP_WRITE_TIMEOUT_MS:-5000}
      ONBOARDING_ACTIVATION_TTL: ${ONBOARDING_ACTIVATION_TTL:-24h}
      ONBOARDING_INVITATION_TTL: ${ONBOARDING_INVITATION_TTL:-7d}
      ORDER_DELIVERY_FEE: ${ORDER_DELIVERY_FEE:-200.00}
      SERVER_PORT: 8080
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
      MPESA_BASE_URL: ${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:-}
      MPESA_VERIFY_CALLBACK: ${MPESA_VERIFY_CALLBACK:-true}
      MPESA_AUTH_URL: ${MPESA_AUTH_URL:-https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
      MPESA_STK_PUSH_URL: ${MPESA_STK_PUSH_URL:-https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
      MPESA_FINAL_FAILURE_RESULT_CODES: ${MPESA_FINAL_FAILURE_RESULT_CODES:-1032}
      MPESA_CONNECT_TIMEOUT: ${MPESA_CONNECT_TIMEOUT:-3s}
      MPESA_READ_TIMEOUT: ${MPESA_READ_TIMEOUT:-10s}
      ORDER_RESERVATION_TTL: ${ORDER_RESERVATION_TTL:-15m}
      ORDER_MAX_OPEN_PENDING_PER_CUSTOMER: ${ORDER_MAX_OPEN_PENDING_PER_CUSTOMER:-5}
      ORDER_RESERVATION_EXPIRY_SCAN_MS: ${ORDER_RESERVATION_EXPIRY_SCAN_MS:-60000}
      ORDER_RESERVATION_EXPIRY_BATCH_SIZE: ${ORDER_RESERVATION_EXPIRY_BATCH_SIZE:-100}
      OTP_SMS_ENDPOINT: ${OTP_SMS_ENDPOINT:-}
      OTP_SMS_API_KEY: ${OTP_SMS_API_KEY:-}
      OTP_SMS_SENDER_ID: ${OTP_SMS_SENDER_ID:-LogiFlow}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
