# Explicitly activate with: mvn spring-boot:run -Dspring-boot.run.profiles=gmail-test
# Credentials and addresses must be supplied through environment variables.
app.mail.enabled=true
app.mail.from=${MAIL_FROM}
app.super-admin.emails=${SUPER_ADMIN_EMAILS}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
