# Production Daraja callbacks must name Safaricom's source addresses.
# An empty allowlist fails closed. The STK query can still confirm a
# payment whose callback was rejected. Render appends one X-Forwarded-For hop.
mpesa.callback-ip-allowlist-required=${MPESA_CALLBACK_IP_ALLOWLIST_REQUIRED:true}
mpesa.callback-trusted-proxy-count=${MPESA_CALLBACK_TRUSTED_PROXY_COUNT:1}
# Safaricom cannot send X-Mpesa-Callback-Secret; only the URL token is accepted.
mpesa.callback-header-secret-enabled=false
spring.mvc.log-request-details=false

# Demo and simulated payments are forbidden in production. ProductionDemoFlagGuard
# fails startup if either flag resolves to true from the environment.
app.demo.customer-fulfillment.enabled=false
logiflow.demo-payments.enabled=false

