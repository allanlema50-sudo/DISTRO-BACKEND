spring.application.name=DISTRO BACKEND

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/distro_backend
server.port=8081
spring.datasource.username=postgres
spring.datasource.password=2026
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/distro_backend}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway owns schema changes in every environment.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=logiflow
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=7

# OTP
app.otp.ttl-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# CORS
app.cors.allowed-origins=http://localhost:4200

# Orders
app.orders.delivery-fee=200.00
# Secrets Configuration
spring.config.import=optional:file:application-secrets.properties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Operational endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI. Disable with OPENAPI_ENABLED=false outside trusted environments.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.packages-to-scan=com.example.distrobackend.controller
