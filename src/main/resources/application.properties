spring.application.name=DISTRO BACKEND

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/distro_backend}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${API_SERVER_PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway owns schema changes in every environment.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=logiflow
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=7

# OTP
app.otp.ttl-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# CORS
app.cors.allowed-origins=http://localhost:4200

# Orders
app.orders.delivery-fee=${ORDERS_DELIVERY_FEE:0.00}

# M-Pesa / Daraja. Leave credentials empty only when payment initiation is not enabled.
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.shortcode=${MPESA_SHORTCODE:}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback-url=${MPESA_CALLBACK_URL:http://localhost:8080/api/v1/payments/mpesa/callback}
mpesa.callback-secret=${MPESA_CALLBACK_SECRET:}
mpesa.auth-url=${MPESA_AUTH_URL:https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
mpesa.stk-push-url=${MPESA_STK_PUSH_URL:https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}

# Request pagination limits
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Secrets Configuration
spring.config.import=optional:file:application-secrets.properties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Operational endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI. Disable with OPENAPI_ENABLED=false outside trusted environments.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.packages-to-scan=com.example.distrobackend.controller
