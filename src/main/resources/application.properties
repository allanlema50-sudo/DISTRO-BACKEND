spring.application.name=DISTRO BACKEND

# Runtime configuration is environment-driven. Defaults are intentionally
# suitable only for local development; production deployments must provide
# all secrets through their secret manager.
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/distro_backend}
spring.datasource.username=${DATABASE_USERNAME:distro}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway owns schema changes in every environment.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Existing non-empty databases may opt in after a compatibility review.
# Keep this false by default so an unexpected schema is never silently baselined.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:logiflow}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}

# OTP
app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
otp.sms.endpoint=${OTP_SMS_ENDPOINT:}
otp.sms.api-key=${OTP_SMS_API_KEY:}
otp.sms.sender-id=${OTP_SMS_SENDER_ID:LogiFlow}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Orders
app.orders.delivery-fee=${ORDER_DELIVERY_FEE:200.00}

# Daraja/M-Pesa. Empty local values allow the API to start, but payment
# initiation fails closed until real credentials are configured.
mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.shortcode=${MPESA_SHORTCODE:}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback-url=${MPESA_CALLBACK_URL:}
mpesa.callback-secret=${MPESA_CALLBACK_SECRET:}
mpesa.auth-url=${MPESA_AUTH_URL:https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
mpesa.stk-push-url=${MPESA_STK_PUSH_URL:https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
# Callback verification is mandatory; false fails closed and rejects callbacks.
mpesa.verify-callback=${MPESA_VERIFY_CALLBACK:true}
mpesa.connect-timeout=${MPESA_CONNECT_TIMEOUT:3s}
mpesa.read-timeout=${MPESA_READ_TIMEOUT:10s}

# Request pagination limits
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Secrets Configuration
spring.config.import=optional:file:application-secrets.properties

# Operational endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI. Disable in production unless access is restricted.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.packages-to-scan=com.example.distrobackend.controller
